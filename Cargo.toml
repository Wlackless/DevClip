[package]
name = "devclip"
version = "0.1.0"
edition = "2024"
description = "Um gravador de tela discreto para Windows"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
raw-window-handle = "0.6"
windows-capture = "2.0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.release]
lto = "thin"
strip = true

